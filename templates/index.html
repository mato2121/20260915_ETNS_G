<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETNS 할일관리</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <span class="user-badge">👤 {{ current_user.username }}</span>
      <form action="{{ url_for('logout') }}" method="post">
        <button type="submit" class="logout-btn">로그아웃</button>
      </form>
    </div>

    <h1>📝 ETNS 할일관리</h1>

    <form class="add-form" action="{{ url_for('add') }}" method="post">
      <input type="hidden" name="filter" value="{{ filter_value }}">
      <input type="text" name="title" placeholder="할 일을 입력하세요" autocomplete="off" required autofocus>
      <button type="submit">추가</button>
    </form>

    <div class="stats">
      <span>전체 {{ total }}</span>
      <span>미완료 {{ active_count }}</span>
      <span>완료 {{ done_count }}</span>
    </div>

    <div class="filters">
      <a class="{{ 'active' if filter_value == 'all' else '' }}" href="{{ url_for('index', filter='all') }}">전체</a>
      <a class="{{ 'active' if filter_value == 'active' else '' }}" href="{{ url_for('index', filter='active') }}">미완료</a>
      <a class="{{ 'active' if filter_value == 'done' else '' }}" href="{{ url_for('index', filter='done') }}">완료</a>
    </div>

    <ul class="todo-list">
      {% for todo in todos %}
      <li class="{{ 'done' if todo.done else '' }}">
        <form action="{{ url_for('toggle', todo_id=todo.id, filter=filter_value) }}" method="post" class="toggle-form">
          <button type="submit" class="check-btn">{{ '✅' if todo.done else '⬜' }}</button>
        </form>

        <span class="title">{{ todo.title }}</span>

        <div class="actions">
          <button type="button" class="edit-btn" onclick="document.getElementById('edit-{{ todo.id }}').classList.toggle('open')">수정</button>
          <form action="{{ url_for('delete', todo_id=todo.id, filter=filter_value) }}" method="post">
            <button type="submit" class="delete-btn" onclick="return confirm('삭제하시겠습니까?')">삭제</button>
          </form>
        </div>

        <form id="edit-{{ todo.id }}" class="edit-form" action="{{ url_for('edit', todo_id=todo.id, filter=filter_value) }}" method="post">
          <input type="text" name="title" value="{{ todo.title }}" required>
          <button type="submit">저장</button>
        </form>
      </li>
      {% else %}
      <li class="empty">할 일이 없습니다.</li>
      {% endfor %}
    </ul>

    {% if done_count > 0 %}
    <form action="{{ url_for('clear_done', filter=filter_value) }}" method="post" class="clear-form">
      <button type="submit">완료된 항목 지우기</button>
    </form>
    {% endif %}
  </div>
</body>
</html>
