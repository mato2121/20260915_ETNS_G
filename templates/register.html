<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 · ETNS 할일관리</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container auth-container">
    <h1>📝 ETNS 할일관리</h1>
    <p class="auth-subtitle">계정을 만들고 나만의 할 일 목록을 시작하세요</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
      <div class="flash">
        {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    <form class="auth-form" action="{{ url_for('register') }}" method="post">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" value="{{ username }}" autocomplete="username" minlength="3" required autofocus>

      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="4" required>

      <label for="password_confirm">비밀번호 확인</label>
      <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" minlength="4" required>

      <button type="submit">회원가입</button>
    </form>

    <p class="auth-switch">이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
  </div>
</body>
</html>
